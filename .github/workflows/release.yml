name: Build & Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach binaries to"
        required: true
        default: "triastasis-v0.0.1-alpha.1"

permissions:
  contents: write

# Standard native-runtime asset names consumed by the Triastasis installers:
#   trellis-<backend>-<os>-x64.<tar.gz|zip>
# cuda12 is an additional legacy artifact selected by the standalone installer
# for Pascal/Volta devices; it does not replace the current-CUDA asset.
jobs:
  build:
    name: ${{ matrix.os }} · ${{ matrix.release_backend || matrix.backend }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows, backend: vulkan, runner: windows-2022 }
          - { os: windows, backend: cuda,   release_backend: cuda,   cuda_version: "13.1.0", cuda_archs: "75;80;86;89;90;120", runner: windows-2022 }
          - { os: windows, backend: cuda,   release_backend: cuda12, cuda_version: "12.9.1", cuda_archs: "60;61;70",          runner: windows-2022 }
          - { os: windows, backend: rocm,   runner: windows-2022, experimental: true }

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: MSVC dev shell (Windows)
        if: matrix.os == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.release_backend || matrix.backend }}

      # Windows: ggml-vulkan + the deform_conv shader need the full SDK
      # (SPIRV-Headers/-Tools CMake configs), which the minimal install lacks.
      - name: Vulkan SDK (Windows)
        if: matrix.backend == 'vulkan' && matrix.os == 'windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.309.0
          install_runtime: true
          cache: true
      - name: SPIRV-Headers (Windows Vulkan)
        if: matrix.backend == 'vulkan' && matrix.os == 'windows'
        shell: bash
        run: |
          set -e
          git clone --depth 1 --branch vulkan-sdk-1.4.309.0 https://github.com/KhronosGroup/SPIRV-Headers \
            || git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers
          cmake -S SPIRV-Headers -B SPIRV-Headers/build -DCMAKE_INSTALL_PREFIX="$PWD/spirv-headers-install"
          cmake --build SPIRV-Headers/build --target install --config Release
          echo "SPIRV_HEADERS_ROOT=$(cygpath -m "$PWD/spirv-headers-install")" >> "$GITHUB_ENV"

      - name: CUDA toolkit
        if: matrix.backend == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.30
        with:
          cuda: ${{ matrix.cuda_version }}
          method: network

      - name: ROCm TheRock (Windows, gfx1151)
        if: matrix.backend == 'rocm' && matrix.os == 'windows'
        shell: bash
        run: |
          set -e
          base="https://rocm.nightlies.amd.com/tarball-multi-arch"
          prefix="therock-dist-windows-gfx1151-"
          files=$(curl -s "$base/" | tr '\n' ' ' | grep -oP 'const files = \K\[.*?\](?=\s*;)')
          latest=$(echo "$files" | jq -r --arg p "$prefix" \
            '[.[]|select(.name|startswith($p))|select(.name|test("[0-9]{8}\\.tar\\.gz$"))]|sort_by(.name|capture("(?<d>[0-9]{8})\\.tar\\.gz$").d)|last|.name // empty')
          test -n "$latest"
          echo "TheRock tarball: $latest"
          mkdir -p rocm
          curl -sL "$base/$latest" | tar -xzf - -C rocm --strip-components=1
          HIP=$(cygpath -m "$PWD/rocm")
          {
            echo "HIP_PATH=$HIP"
            echo "HIP_PLATFORM=amd"
            echo "ROCM_CC=$HIP/lib/llvm/bin/clang.exe"
            echo "ROCM_CXX=$HIP/lib/llvm/bin/clang++.exe"
          } >> "$GITHUB_ENV"
          echo "$PWD/rocm/bin" >> "$GITHUB_PATH"
          echo "$PWD/rocm/lib/llvm/bin" >> "$GITHUB_PATH"

      - name: Configure & build
        shell: bash
        run: |
          set -e
          case "${{ matrix.backend }}" in
            vulkan) FLAGS="-DGGML_VULKAN=ON" ;;
            # ggml rewrites 12x -> 12xa (arch-specific); Blackwell ships SASS-only
            # (120a can't be virtual), so no PTX fallback entry here.
            cuda)   FLAGS="-DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=${{ matrix.cuda_archs }}" ;;
            # Popular consumer ISAs: RDNA2 dGPUs, RDNA3 dGPUs + 780M, RDNA3.5 iGPUs, RDNA4.
            rocm)   FLAGS="-DGGML_HIP=ON -DGGML_HIP_GRAPHS=OFF -DGPU_TARGETS=gfx1030;gfx1031;gfx1032;gfx1100;gfx1101;gfx1102;gfx1103;gfx1150;gfx1151;gfx1152;gfx1200;gfx1201 -DCMAKE_C_COMPILER=$ROCM_CC -DCMAKE_CXX_COMPILER=$ROCM_CXX -DCMAKE_PREFIX_PATH=$HIP_PATH -DCMAKE_HIP_COMPILER=$ROCM_CXX" ;;
          esac
          # Windows builds only: TheRock's Windows ROCm dist ships a minimal
          # Clang toolchain (enough to compile HIP kernels) but not the LLVM
          # OpenMP runtime, so a ggml-cpu linked against OpenMP fails to start
          # (missing libomp140.x86_64.dll). ggml has its own portable thread
          # pool for exactly this case; use it instead of chasing the DLL.
          # (trellis.cpp's own deform_conv_cpu.cpp no longer uses OpenMP
          # either -- see CMakeLists.txt / src/deform_conv_cpu.cpp.)
          FLAGS="$FLAGS -DGGML_OPENMP=OFF"
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release $FLAGS ${SPIRV_HEADERS_ROOT:+-DCMAKE_PREFIX_PATH=$SPIRV_HEADERS_ROOT}
          # Ship both the resident HTTP server and the one-shot CLI (issue #15).
          cmake --build build --target trellis-server trellis-cli -j

      - name: Package
        shell: bash
        run: |
          set -e
          mkdir -p dist
          mkdir -p dist/licenses
          cp LICENSE dist/LICENSE.txt
          cp THIRD_PARTY_NOTICES.md dist/
          cp thirdparty/ggml/LICENSE dist/licenses/ggml-LICENSE.txt
          cp thirdparty/meshoptimizer/LICENSE.md dist/licenses/meshoptimizer-LICENSE.md
          cp thirdparty/fqms/LICENSE.md dist/licenses/fqms-LICENSE.md
          cp thirdparty/xatlas-LICENSE.txt dist/licenses/xatlas-LICENSE.txt
          cp thirdparty/cpp-httplib-LICENSE.txt dist/licenses/cpp-httplib-LICENSE.txt
          cp thirdparty/stb-LICENSE.txt dist/licenses/stb-LICENSE.txt
          cp thirdparty/libwebp-COPYING.txt dist/licenses/libwebp-COPYING.txt
          cp build/trellis-server.exe dist/
          cp build/trellis-cli.exe dist/
          cp build/*.dll dist/ 2>/dev/null || true
          if [ "${{ matrix.backend }}" = "cuda" ]; then
            # $CUDA_PATH is a Windows path (backslashes/spaces) that breaks bash
            # globbing. CUDA 13 also relocated the Windows runtime DLLs out of
            # bin/ (into bin/x64), so locate each wherever it lives under the
            # toolkit and fail loudly (set -e) rather than shipping a zip with
            # no CUDA runtime.
            cuda_root="$(cygpath -u "$CUDA_PATH")"
            echo "== CUDA runtime DLLs found under $cuda_root =="
            find "$cuda_root" -type f \( -name 'cudart64_*.dll' -o -name 'cublas64_*.dll' -o -name 'cublasLt64_*.dll' \) -print
            for dll in cudart64 cublas64 cublasLt64; do
              src="$(find "$cuda_root" -type f -name "${dll}_*.dll" -print -quit)"
              if [ -z "$src" ]; then echo "ERROR: ${dll}_*.dll not found under CUDA toolkit"; exit 1; fi
              cp "$src" dist/
            done
            ls -la dist/*.dll
          fi
          ASSET="trellis-${{ matrix.release_backend || matrix.backend }}-windows-x64.zip"
          (cd dist && 7z a -y "../$ASSET" ./* >/dev/null)
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "value=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          sha256sum "$ASSET" > "$ASSET.sha256"
          gh release upload "${{ steps.tag.outputs.value }}" "$ASSET" "$ASSET.sha256" --clobber --repo "${{ github.repository }}"

  # Triastasis desktop app (Tauri). Small, backend-agnostic installers that
  # the install/ scripts fetch by these stable, version-less names:
  #   triastasis-windows-x64-setup.exe
  studio:
    name: ${{ matrix.os }} · Triastasis app
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows, runner: windows-2022 }

    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Build Triastasis
        working-directory: app
        run: |
          npm ci
          npm run tauri build

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "value=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package & upload (Windows)
        if: matrix.os == 'windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          base=app/src-tauri/target/release/bundle
          # tauri.conf.json builds an NSIS installer (per-user, silent-installable)
          exe=$(find "$base/nsis" -name '*-setup.exe' | head -1)
          test -n "$exe" || { echo "NSIS installer not found under $base/nsis"; ls -R "$base" || true; exit 1; }
          cp "$exe" triastasis-windows-x64-setup.exe
          # Portable, no-install zip: the raw exe + a portable.dat marker (which
          # makes the app keep config/data next to itself). WebView2 runtime is a
          # system component, present on Win10/11.
          rm -rf portable && mkdir -p portable
          cp app/src-tauri/target/release/triastasis.exe portable/
          cp app/src-tauri/target/release/*.dll portable/ 2>/dev/null || true
          cp install/portable-readme.txt portable/README.txt
          cp LICENSE portable/LICENSE.txt
          cp THIRD_PARTY_NOTICES.md portable/
          mkdir -p portable/licenses
          cp app/node_modules/three/LICENSE portable/licenses/three-LICENSE.txt
          cp app/node_modules/@tauri-apps/api/LICENSE_MIT portable/licenses/Tauri-LICENSE-MIT.txt
          cp app/node_modules/@tauri-apps/api/LICENSE_APACHE-2.0 portable/licenses/Tauri-LICENSE-APACHE-2.0.txt
          cp app/public/fonts/LICENSE.txt portable/licenses/Inter-LICENSE.txt
          cp app/public/icons/LICENSE-lucide.txt portable/licenses/Lucide-LICENSE.txt
          : > portable/portable.dat
          (cd portable && 7z a -y ../triastasis-windows-x64-portable.zip ./* >/dev/null)
          sha256sum triastasis-windows-x64-setup.exe > triastasis-windows-x64-setup.exe.sha256
          sha256sum triastasis-windows-x64-portable.zip > triastasis-windows-x64-portable.zip.sha256
          gh release upload "${{ steps.tag.outputs.value }}" \
            triastasis-windows-x64-setup.exe triastasis-windows-x64-setup.exe.sha256 \
            triastasis-windows-x64-portable.zip triastasis-windows-x64-portable.zip.sha256 \
            --clobber --repo "${{ github.repository }}"
