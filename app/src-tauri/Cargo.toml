[package]
name = "triastasis"
version = "0.0.1-alpha.1"
description = "Triastasis - local image-to-3D generation UI for trellis.cpp"
authors = ["Triastasis"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "=2.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
dirs = "5"
tiny_http = "=0.12.0"
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
